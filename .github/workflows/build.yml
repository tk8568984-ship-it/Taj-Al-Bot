name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip & Locate Project
        run: |
          unzip -o TAJ_QX_OVERLAY_BOT_Native_Project.zip
          ROOT_DIR=$(find . -name "build.gradle*" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
          if [ -n "$ROOT_DIR" ] && [ "$ROOT_DIR" != "." ]; then
            cp -r $ROOT_DIR/* .
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAJ-QX-Bot-APK
          path: "**/outputs/apk/debug/*.apk"
          
